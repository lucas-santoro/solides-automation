services:
  solides-mcp:
    build: .
    env_file: .env
    environment:
      # Dentro do container: escuta em todas as interfaces na 8000, sem janela de navegador.
      SOLIDES_MCP_HOST: 0.0.0.0
      SOLIDES_MCP_PORT: 8000
      SOLIDES_HEADLESS: "true"
    ports:
      # Só no localhost do servidor; exponha para fora com um reverse proxy com HTTPS.
      - "127.0.0.1:8000:8000"
    volumes:
      - artifacts:/app/artifacts
    shm_size: 1gb
    init: true
    restart: unless-stopped

  agendador:
    # Mesma imagem, outro processo: bate entrada e saída nos dias configurados (SOLIDES_AGENDA_* no .env).
    # Comandos: docker compose exec agendador solides agendador status | pausar [--ate AAAA-MM-DD] | retomar
    build: .
    command: ["solides", "agendador"]
    env_file: .env
    environment:
      SOLIDES_HEADLESS: "true"
      PYTHONUNBUFFERED: "1"
    volumes:
      - artifacts:/app/artifacts
    shm_size: 1gb
    init: true
    restart: unless-stopped

volumes:
  artifacts:
