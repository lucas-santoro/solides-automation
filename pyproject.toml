[project]
name = "solides-mcp"
version = "0.1.0"
description = "Servidor MCP (Playwright) para corrigir marcações de ponto esquecidas no Sólides/Tangerino"
authors = [
    { name = "Lucas Santoro", email = "106706839+lucas-santoro@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
    "playwright>=1.64.0",
    "pydantic-settings>=2.16.0",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
solides-mcp = "solides_mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
